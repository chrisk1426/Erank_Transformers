# Model
n_layers: 2
d_model: 128
n_heads: 4
d_mlp: 512  # 4x d_model is standard
act_fn: "gelu"

# Modular Addition Task
mod_p: 113
mod_train_frac: 0.3  # match Nanda's grokking setup

# Key-Value Retrieval Task
kv_num_keys: 5
kv_vocab_size: 30
kv_train_frac: 0.7

# Training
batch_size: 256
learning_rate: 1e-3
weight_decay: 1.0
num_epochs: 50000  # modular addition needs many epochs to grok
checkpoint_every: 1000
seed: 42

# eRank
n_examples_erank: 500
